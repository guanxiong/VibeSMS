name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/vibesms-release.jks
      - name: Verify tag and build signed APK
        env:
          VIBESMS_KEYSTORE_PATH: signing/vibesms-release.jks
          VIBESMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIBESMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIBESMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "../VibeSMS-${VERSION}.apk"
          cd ..
          sha256sum "VibeSMS-${VERSION}.apk" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "../VibeSMS-${VERSION}.apk" \
            ../SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "VibeSMS Android $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
