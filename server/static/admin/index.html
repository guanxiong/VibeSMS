<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VibeSMS</title>
    <link rel="stylesheet" href="/admin/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">ANDROID EDGE · AGENT SMS</p>
          <h1>VibeSMS</h1>
          <p class="subtitle">双卡短信与来电终端、在线状态和接收记录</p>
        </div>
        <div class="header-actions">
          <a class="home-link" href="/">项目主页</a>
          <div class="status"><span id="status-dot"></span><span id="status-text">正在连接</span></div>
        </div>
      </header>

      <section class="summary" aria-label="概览">
        <article><span>设备</span><strong id="device-count">0</strong></article>
        <article><span>短信</span><strong id="sms-count">0</strong></article>
        <article><span>来电</span><strong id="call-count">0</strong></article>
        <article><span>在线</span><strong id="online-count">0</strong></article>
        <article><span>用户 Key</span><strong id="key-count">0</strong></article>
      </section>

      <section>
        <div class="section-title">
          <div><p class="eyebrow">ACCESS</p><h2>号码与用户 Key</h2></div>
          <span class="section-hint">Key 明文仅显示一次</span>
        </div>
        <div class="key-console">
          <form id="key-form" class="key-form">
            <label>手机号<input id="key-phone" name="phone_number" inputmode="tel" placeholder="+8613800000000" required></label>
            <label>标签<input id="key-label" name="label" placeholder="客户或用途"></label>
            <label>Owner Ref<input id="key-owner" name="owner_ref" placeholder="panel:user-id（可选）"></label>
            <label>预绑定设备<input id="key-device" name="device_id" placeholder="留空则由 APK 首次绑定"></label>
            <label>SIM 卡槽<select id="key-sim" name="sim_slot"><option value="1">SIM 1</option><option value="2">SIM 2</option></select></label>
            <button class="primary-action" type="submit">签发 Key</button>
          </form>
          <div>
            <div id="key-secret" class="key-secret" hidden>
              <div><span>仅显示一次</span><strong id="key-secret-label">新 Key</strong></div>
              <code id="key-secret-value"></code>
              <button id="copy-key" type="button">复制 Key</button>
            </div>
            <div id="keys" class="keys"><p class="empty">尚未签发用户 Key</p></div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-title">
          <div><p class="eyebrow">FLEET</p><h2>终端状态</h2></div>
          <button id="refresh" type="button">刷新</button>
        </div>
        <div id="devices" class="devices"><p class="empty">等待终端上报…</p></div>
      </section>

      <section>
        <div class="section-title">
          <div><p class="eyebrow">INBOX</p><h2>事件记录</h2></div>
          <div class="filters" role="group" aria-label="事件过滤">
            <button class="filter active" data-type="">全部</button>
            <button class="filter" data-type="sms">短信</button>
            <button class="filter" data-type="call">来电</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>时间</th><th>类型</th><th>SIM</th><th>来源</th><th>内容 / 状态</th><th>设备</th></tr></thead>
            <tbody id="events"><tr><td colspan="6" class="empty">尚无事件</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/admin/app.js" defer></script>
  </body>
</html>
