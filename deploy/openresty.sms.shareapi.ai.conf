# SMS Gateway — sms.shareapi.ai
# TLS is terminated by the existing 1Panel OpenResty host-network container.

server {
    listen 80;
    listen [::]:80;
    server_name sms.shareapi.ai;
    return 301 https://$host$request_uri;
}

server {
    # Keep the syntax used by this host's existing 1Panel OpenResty vhosts.
    listen 443 ssl http2;
    server_name sms.shareapi.ai;

    access_log /www/sites/sms.shareapi.ai/log/access.log;
    error_log /www/sites/sms.shareapi.ai/log/error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    ssl_certificate /www/sites/sms.shareapi.ai/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/sms.shareapi.ai/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
