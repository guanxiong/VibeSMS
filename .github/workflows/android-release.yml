name: Android Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify tag and build unsigned APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" app/build/outputs/apk/release/apksigner.jar
      - name: Upload release candidate and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: vibesms-release-candidate-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/apksigner.jar
